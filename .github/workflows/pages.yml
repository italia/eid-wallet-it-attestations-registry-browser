name: GitHub Pages

# CD B — pubblica il sito solo dopo CI (app) o nightly dump (cache) riusciti.
# Un `if` custom su `needs` toglie il success() implicito di GitHub: senza
# `needs.*.result == 'success'` build/deploy potrebbero girare anche se i test falliscono.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI', 'Nightly registry dump']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/run-tests

  build:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-cache-public.mjs
      - run: npm run build
        env:
          VITE_BASE: /eid-wallet-it-attestations-registry-browser/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [test, build]
    if: ${{ needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
