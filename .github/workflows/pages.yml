name: GitHub Pages

# CD B — pubblica il sito solo dopo CI (app, suite completa) o nightly dump
# (unit test sul dump) riusciti. Non riesegue i test: la dipendenza è il
# `workflow_run` con conclusion success.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI', 'Nightly registry dump']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-cache-public.mjs
      - run: npm run build
        env:
          VITE_BASE: /eid-wallet-it-attestations-registry-browser/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
