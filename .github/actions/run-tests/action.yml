name: Run tests
description: Install dependencies, Chromium, and run unit plus Playwright e2e tests.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
      shell: bash
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Chromium
      run: timeout 8m npx playwright install --with-deps chromium
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
    - run: timeout 12m npm test
      shell: bash
      env:
        VITE_BASE: /
        VITE_SKIP_LIVE: '1'
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        if-no-files-found: ignore
        retention-days: 7
